name: expense-tracker
services:
  postgres:
    container_name: postgres-et
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: expense_tracker
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/data/postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - expense-tracker-network
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8064:8080"
    networks:
      - expense-tracker-network


networks:
  expense-tracker-network:
    driver: bridge

volumes:
  postgres:
    driver: local
