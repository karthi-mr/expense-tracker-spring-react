name: expense-tracker
services:
  postgres:
    container_name: postgres-et
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: expense-tracker
    restart: unless-stopped
    ports:
      - "5434:5432"
    networks:
      - expense-tracker-network
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - expense-tracker-network


networks:
  expense-tracker-network:
    driver: bridge
